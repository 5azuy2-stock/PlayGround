<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08080d" />
  <meta name="description" content="نبض — تطبيق اجتماعي عربي يجمع المنشورات والفيديوهات والرسائل والألعاب في مكان واحد." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="نبض" />
  <title>نبض — لحظاتك، بين الناس</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="ambient-orb one"></span>
    <span class="ambient-orb two"></span>
    <span class="ambient-orb three"></span>
    <span class="ambient-grid"></span>
  </div>

  <div class="app-shell" id="app">
    <header class="topbar">
      <button class="brand" type="button" data-action="nav" data-tab="posts" aria-label="نبض — الصفحة الرئيسية">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><use href="#i-pulse"></use></svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">نبض</span>
          <span class="brand-tag">شبكتك، على مزاجك</span>
        </span>
      </button>

      <div class="topbar-actions">
        <button class="top-btn" type="button" data-action="open-add" aria-label="إضافة عبر المعرّف" title="إضافة عبر المعرّف">
          <svg class="ic" viewBox="0 0 24 24"><use href="#i-add-user"></use></svg>
        </button>
        <button class="top-btn" type="button" data-action="open-notifications" aria-label="الإشعارات" title="الإشعارات">
          <svg class="ic" viewBox="0 0 24 24"><use href="#i-bell"></use></svg>
          <span class="dot-badge" id="notif-dot" hidden></span>
        </button>
      </div>
    </header>

    <main id="main">
      <section class="view" data-view="account" aria-label="الحساب"></section>
      <section class="view" data-view="messages" aria-label="الرسائل"></section>
      <section class="view view-reels" data-view="videos" aria-label="الفيديوهات"></section>
      <section class="view" data-view="posts" aria-label="المنشورات"></section>
      <section class="view" data-view="games" aria-label="الألعاب"></section>
    </main>

    <nav class="bottom-nav" aria-label="التنقل الرئيسي">
      <button class="nav-item is-active" type="button" data-action="nav" data-tab="account">
        <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24"><use href="#i-user"></use></svg></span>
        <span class="nav-label">الحساب</span>
      </button>
      <button class="nav-item" type="button" data-action="nav" data-tab="messages">
        <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24"><use href="#i-chat"></use></svg><span class="nav-badge" id="msg-badge" hidden></span></span>
        <span class="nav-label">الرسائل</span>
      </button>
      <button class="nav-item" type="button" data-action="nav" data-tab="videos">
        <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24"><use href="#i-reels"></use></svg></span>
        <span class="nav-label">الفيديوهات</span>
      </button>
      <button class="nav-item" type="button" data-action="nav" data-tab="posts">
        <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24"><use href="#i-grid"></use></svg></span>
        <span class="nav-label">المنشورات</span>
      </button>
      <button class="nav-item" type="button" data-action="nav" data-tab="games">
        <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24"><use href="#i-gamepad"></use></svg></span>
        <span class="nav-label">الألعاب</span>
      </button>
    </nav>

    <div id="overlay-root"></div>
    <div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="false"></div>

    <div class="boot" id="boot" aria-hidden="true">
      <div class="boot-inner">
        <span class="boot-mark">
          <svg viewBox="0 0 24 24"><use href="#i-pulse"></use></svg>
        </span>
        <span class="boot-name">نبض</span>
        <span class="boot-line"><i></i></span>
      </div>
    </div>
  </div>

</body>
</html>
